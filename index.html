<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio de Conception de Produits</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-logo">🧩</span>
      <div>
        <h1>Studio de Conception</h1>
        <p class="brand-sub">Gérez vos concepts produits de l'idée au lancement</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="btn-import" class="btn btn-ghost" title="Importer un fichier JSON">Importer</button>
      <button id="btn-export" class="btn btn-ghost" title="Exporter en JSON">Exporter</button>
      <button id="btn-new" class="btn btn-primary">+ Nouveau concept</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <section class="toolbar">
    <input type="search" id="search" class="search" placeholder="Rechercher un concept, une catégorie, un matériau…" />
    <div class="filters">
      <select id="filter-category" class="select" aria-label="Filtrer par catégorie">
        <option value="">Toutes les catégories</option>
      </select>
      <select id="filter-priority" class="select" aria-label="Filtrer par priorité">
        <option value="">Toutes les priorités</option>
        <option value="Haute">Priorité haute</option>
        <option value="Moyenne">Priorité moyenne</option>
        <option value="Basse">Priorité basse</option>
      </select>
      <select id="sort" class="select" aria-label="Trier">
        <option value="updated">Récemment modifiés</option>
        <option value="created">Récemment créés</option>
        <option value="name">Nom (A→Z)</option>
        <option value="priority">Priorité</option>
      </select>
    </div>
  </section>

  <main id="board" class="board"></main>

  <!-- Modale de fiche concept -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modal-title">Nouveau concept</h2>
        <button id="modal-close" class="icon-btn" aria-label="Fermer">✕</button>
      </div>
      <form id="form" class="form">
        <input type="hidden" id="f-id" />
        <div class="form-row">
          <label class="field">
            <span>Nom du produit *</span>
            <input type="text" id="f-name" required placeholder="Ex. Lampe modulaire Aura" />
          </label>
          <label class="field">
            <span>Catégorie</span>
            <input type="text" id="f-category" list="category-list" placeholder="Ex. Mobilier, Électronique…" />
            <datalist id="category-list"></datalist>
          </label>
        </div>

        <div class="form-row">
          <label class="field">
            <span>Étape</span>
            <select id="f-status">
              <option value="idea">Idée</option>
              <option value="design">Conception</option>
              <option value="prototype">Prototype</option>
              <option value="validated">Validé</option>
              <option value="launched">Lancé</option>
            </select>
          </label>
          <label class="field">
            <span>Priorité</span>
            <select id="f-priority">
              <option value="Moyenne">Moyenne</option>
              <option value="Haute">Haute</option>
              <option value="Basse">Basse</option>
            </select>
          </label>
          <label class="field">
            <span>Coût cible (€)</span>
            <input type="number" id="f-cost" min="0" step="0.01" placeholder="0.00" />
          </label>
        </div>

        <label class="field">
          <span>Description / concept</span>
          <textarea id="f-description" rows="3" placeholder="Le problème résolu, le parti pris de design, l'usage…"></textarea>
        </label>

        <div class="form-row">
          <label class="field">
            <span>Matériaux (séparés par des virgules)</span>
            <input type="text" id="f-materials" placeholder="Aluminium, chêne, verre…" />
          </label>
          <label class="field">
            <span>Image / esquisse (URL)</span>
            <input type="url" id="f-image" placeholder="https://…" />
          </label>
        </div>

        <label class="field">
          <span>Notes de conception</span>
          <textarea id="f-notes" rows="2" placeholder="Contraintes, retours, prochaines étapes…"></textarea>
        </label>

        <div class="modal-foot">
          <button type="button" id="btn-delete" class="btn btn-danger hidden">Supprimer</button>
          <div class="spacer"></div>
          <button type="button" id="btn-cancel" class="btn btn-ghost">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <input type="file" id="file-input" accept="application/json" class="hidden" />

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
