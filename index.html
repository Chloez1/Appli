<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio de Conception de Produits</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>" />
  <!-- Carte d'import pour charger Three.js à la demande dans la visionneuse 3D -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-logo">🧩</span>
      <div>
        <h1>Studio de Conception</h1>
        <p class="brand-sub">Gérez vos concepts produits de l'idée au lancement</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="btn-categories" class="btn btn-ghost" title="Gérer les catégories">Catégories</button>
      <button id="btn-import" class="btn btn-ghost" title="Importer un fichier JSON">Importer</button>
      <button id="btn-export" class="btn btn-ghost" title="Exporter en JSON">Exporter</button>
      <button id="btn-new" class="btn btn-primary">+ Nouveau concept</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <section class="toolbar">
    <input type="search" id="search" class="search" placeholder="Rechercher un concept, une catégorie, un matériau…" />
    <div class="filters">
      <select id="filter-category" class="select" aria-label="Filtrer par catégorie">
        <option value="">Toutes les catégories</option>
      </select>
      <select id="filter-priority" class="select" aria-label="Filtrer par priorité">
        <option value="">Toutes les priorités</option>
        <option value="Haute">Priorité haute</option>
        <option value="Moyenne">Priorité moyenne</option>
        <option value="Basse">Priorité basse</option>
      </select>
      <select id="sort" class="select" aria-label="Trier">
        <option value="updated">Récemment modifiés</option>
        <option value="created">Récemment créés</option>
        <option value="name">Nom (A→Z)</option>
        <option value="priority">Priorité</option>
      </select>
    </div>
  </section>

  <main id="board" class="board"></main>

  <!-- Modale de fiche concept -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modal-title">Nouveau concept</h2>
        <button id="modal-close" class="icon-btn" aria-label="Fermer">✕</button>
      </div>
      <form id="form" class="form">
        <input type="hidden" id="f-id" />
        <div class="form-row">
          <label class="field">
            <span>Nom du produit *</span>
            <input type="text" id="f-name" required placeholder="Ex. Lampe modulaire Aura" />
          </label>
          <label class="field">
            <span>Catégorie</span>
            <select id="f-category"></select>
          </label>
        </div>

        <div class="form-row">
          <label class="field">
            <span>Étape</span>
            <select id="f-status">
              <option value="idea">Idée</option>
              <option value="design">Conception</option>
              <option value="prototype">Prototype</option>
              <option value="validated">Validé</option>
              <option value="launched">Lancé</option>
            </select>
          </label>
          <label class="field">
            <span>Priorité</span>
            <select id="f-priority">
              <option value="Moyenne">Moyenne</option>
              <option value="Haute">Haute</option>
              <option value="Basse">Basse</option>
            </select>
          </label>
          <label class="field">
            <span>Coût cible (€)</span>
            <input type="number" id="f-cost" min="0" step="0.01" placeholder="0.00" />
          </label>
        </div>

        <!-- Jalons : dates de validation et de lancement -->
        <div class="form-row milestones">
          <label class="field">
            <span>✅ Date de validation</span>
            <input type="date" id="f-validatedAt" />
          </label>
          <label class="field">
            <span>🚀 Date de lancement</span>
            <input type="date" id="f-launchedAt" />
          </label>
        </div>

        <label class="field">
          <span>Description / concept</span>
          <textarea id="f-description" rows="3" placeholder="Le problème résolu, le parti pris de design, l'usage…"></textarea>
        </label>

        <div class="form-row">
          <label class="field">
            <span>Matériaux (séparés par des virgules)</span>
            <input type="text" id="f-materials" placeholder="Aluminium, chêne, verre…" />
          </label>
          <label class="field">
            <span>Image / esquisse (URL)</span>
            <input type="url" id="f-image" placeholder="https://…" />
          </label>
        </div>

        <div class="form-row model-row">
          <label class="field">
            <span>Modèle 3D importé (URL .glb, .gltf, .stl, .obj)</span>
            <input type="url" id="f-model" placeholder="https://… ou laissez vide" />
          </label>
          <div class="field model-actions">
            <span>&nbsp;</span>
            <button type="button" id="btn-view3d" class="btn btn-ghost">🧊 Voir le modèle 3D</button>
            <button type="button" id="btn-relief" class="btn btn-ghost" title="Transformer l'image / esquisse ci-dessus en relief 3D">🪄 Image → relief 3D</button>
          </div>
        </div>

        <label class="field">
          <span>Notes de conception</span>
          <textarea id="f-notes" rows="2" placeholder="Contraintes, retours, prochaines étapes…"></textarea>
        </label>

        <div class="modal-foot">
          <button type="button" id="btn-delete" class="btn btn-danger hidden">Supprimer</button>
          <div class="spacer"></div>
          <button type="button" id="btn-cancel" class="btn btn-ghost">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Gestionnaire de catégories -->
  <div id="cat-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card cat-card">
      <div class="modal-head">
        <h2>Catégories de produits</h2>
        <button id="cat-close" class="icon-btn" aria-label="Fermer">✕</button>
      </div>
      <div class="form">
        <form id="cat-form" class="cat-add">
          <input type="text" id="cat-input" placeholder="Nouvelle catégorie…" maxlength="40" />
          <button type="submit" class="btn btn-primary">Ajouter</button>
        </form>
        <ul id="cat-list" class="cat-list"></ul>
      </div>
    </div>
  </div>

  <!-- Visionneuse 3D -->
  <div id="viewer" class="modal hidden" role="dialog" aria-modal="true">
    <div class="viewer-card">
      <div class="modal-head">
        <h2 id="viewer-title">Visionneuse 3D</h2>
        <div class="viewer-tools">
          <label class="btn btn-ghost" title="Transformer une image plate en relief 3D">
            🪄 Image → relief
            <input id="viewer-image-file" type="file" accept="image/*" hidden />
          </label>
          <label class="btn btn-ghost" title="Charger un modèle 3D depuis votre ordinateur">
            Modèle 3D
            <input id="viewer-file" type="file" accept=".glb,.gltf,.stl,.obj" hidden />
          </label>
          <button id="viewer-reset" class="btn btn-ghost" title="Recentrer la vue">Recentrer</button>
          <button id="viewer-close" class="icon-btn" aria-label="Fermer">✕</button>
        </div>
      </div>
      <div id="relief-controls" class="relief-controls hidden">
        <label>Profondeur
          <input id="relief-depth" type="range" min="0.05" max="1.5" step="0.05" value="0.45" />
        </label>
        <label>Détail
          <select id="relief-res">
            <option value="120">Rapide</option>
            <option value="200" selected>Standard</option>
            <option value="320">Détaillé</option>
          </select>
        </label>
        <label class="relief-check">
          <input id="relief-invert" type="checkbox" /> Inverser le relief
        </label>
        <label class="relief-check">
          <input id="relief-color" type="checkbox" checked /> Couleurs de l'image
        </label>
      </div>
      <div id="viewer-canvas" class="viewer-canvas">
        <div id="viewer-status" class="viewer-status">Aucun modèle chargé.</div>
      </div>
      <div class="viewer-hint">Glissez pour pivoter · molette pour zoomer · clic droit (ou deux doigts) pour déplacer</div>
    </div>
  </div>

  <input type="file" id="file-input" accept="application/json" class="hidden" />

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
